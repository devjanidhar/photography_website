<form id="contactForm" action="https://formsubmit.co/devjanidhar160@gmail.com" method="POST">
  <!-- Disable CAPTCHA -->
  <input type="hidden" name="_captcha" value="false">

  <!-- Optional: Redirect after submission -->
  <input type="hidden" name="_next" value="https://your-portfolio-site.com/thank-you.html">

  <div class="col-md-4 offset-md-4">
    <div class="form-floating">
      <input type="text" class="form-control border-3" id="name" name="name" placeholder="Your Name">
      <label for="name">Your Name</label>
    </div>
  </div><br>

  <div class="col-md-4 offset-md-4">
    <div class="form-floating">
      <input type="email" class="form-control border-3" id="email" name="email" placeholder="Your Email">
      <label for="email">Your Email</label>
    </div>
  </div><br>

  <div class="col-md-4 offset-md-4">
    <div class="form-floating">
      <input type="text" class="form-control border-3" id="phone" name="phone" placeholder="Phone Number">
      <label for="phone">Phone Number</label>
    </div>
  </div><br>

  <div class="col-md-4 offset-md-4">
    <div class="form-floating">
      <input type="text" class="form-control border-3" id="session" name="session_type" placeholder="Session Type">
      <label for="session">Session Type</label>
    </div>
  </div><br>

  <div class="col-md-4 offset-md-4">
    <div class="form-floating">
      <input type="text" class="form-control border-3" id="event" name="event_date" placeholder="Event Date">
      <label for="event">Event Date</label>
    </div>
  </div><br>

  <div class="col-md-4 offset-md-4">
    <button type="submit" class="btn btn-dark w-100 py-3">Register</button>
  </div>
</form>

<script>
document.getElementById("contactForm").addEventListener("submit", function (e) {
    // Stop form from submitting immediately

  // Get form values
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const session = document.getElementById("session").value.trim();
  const event = document.getElementById("event").value.trim();

  // Validate fields
  if (!name || !email || !phone || !session || !event) {
    alert("Please fill out all fields.");
    return;
  }

  const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
  if (!email.match(emailPattern)) {
    alert("Please enter a valid email address.");
    return;
  }

  const phonePattern = /^[0-9]{10}$/;
  if (!phone.match(phonePattern)) {
    alert("Please enter a valid 10-digit phone number.");
    return;
  }

  // ✅ Show success notification
  alert("✅ Thank you! Your form has been submitted.");

  // Now submit the form
  this.submit();
});

</script>
